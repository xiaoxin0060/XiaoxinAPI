# 🎯 Platform服务 - 生产环境配置
# 优化目标：性能 + 安全 + 监控 + 日志

server:
  # 生产环境端口配置
  address: 0.0.0.0
  port: 8080
  servlet:
    context-path: /api
    session:
      cookie:
        max-age: 86400  # 24小时
        secure: false   # HTTPS环境设为true
        http-only: true

spring:
  # Session配置
  session:
    timeout: 86400

  # 生产环境数据库配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://mysql:3306/xiaoxinapi?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&autoReconnect=true&failOverReadOnly=false&maxReconnects=3&initialTimeout=2
    username: root
    password: ${MYSQL_ROOT_PASSWORD:your_strong_password_here}
    # 🎯 生产级连接池配置
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 50
      minimum-idle: 10
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-test-query: SELECT 1
      validation-timeout: 5000
      leak-detection-threshold: 60000
      initialize-fail-timeout: 1

  # Redis配置
  data:
    redis:
      host: redis
      port: 6379
      password: ${REDIS_PASSWORD:your_redis_password}
      database: 1
      timeout: 5000
      lettuce:
        pool:
          max-active: 20
          max-wait: -1
          max-idle: 10
          min-idle: 5

# MyBatis Plus配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: false
    # 🎯 生产环境：关闭SQL日志输出
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  global-config:
    db-config:
      logic-delete-field: isDelete
      logic-delete-value: 1
      logic-not-delete-value: 0

# 🎯 Gateway服务地址配置
xiaoxin:
  gateway:
    host: ${XIAOXIN_GATEWAY_HOST:http://xiaoxin-gateway:8090}

# Dubbo配置
dubbo:
  registry:
    address: nacos://nacos:8848
    register-mode: instance
    parameters:
      username: nacos
      password: nacos
      namespace: ""
      group: ""
      naming.auth.enable: true
      naming.auth.token: ${NACOS_AUTH_TOKEN:VGhpc0lzTXlDdXN0b21TZWNyZXRLZXkwMTIzNDU2Nzg5MDB}
      naming.auth.identity.key: serverIdentity
      naming.auth.identity.value: security
  config-center:
    address: ""
  protocol:
    name: tri
    port: 50051
  application:
    name: platform-service
    qos-enable: false

# 🎯 生产环境日志配置
logging:
  level:
    com.xiaoxin.api.platform: INFO
    org.springframework.web: WARN
    org.mybatis: WARN
    com.zaxxer.hikari: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n"
  file:
    name: /app/logs/platform.log
    max-size: 100MB
    max-history: 30

# 🎯 监控配置
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    export:
      prometheus:
        enabled: true

# 🎯 生产环境安全配置  
xiaoxin-api:
  jwt:
    secret: ${JWT_SECRET:your-jwt-secret-key-here-must-be-very-long-and-secure}
    expire: 86400000  # 24小时
  rate-limit:
    enabled: true
    max-requests: 1000
    window-seconds: 3600